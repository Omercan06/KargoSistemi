{% extends "base.html" %}

{% block title %}Kargo Gönder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4><i class="fas fa-box"></i> Yeni Kargo Gönderimi</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="station_id" class="form-label">İstasyon Seç <span class="text-danger">*</span></label>
                        <select class="form-select" id="station_id" name="station_id" required>
                            <option value="">-- İstasyon Seçiniz --</option>
                            {% for station in stations %}
                                <option value="{{ station.id }}">{{ station.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="weight" class="form-label">Ağırlık (kg) <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="weight" name="weight" 
                               min="0.1" step="0.1" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="delivery_date" class="form-label">Teslimat Tarihi <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="delivery_date" name="delivery_date" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-paper-plane"></i> Kargo Gönder
                        </button>
                        <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> İptal
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Minimum tarih bugün olsun
    document.addEventListener('DOMContentLoaded', function() {
        var today = new Date().toISOString().split('T')[0];
        document.getElementById('delivery_date').setAttribute('min', today);
    });
</script>
{% endblock %}
